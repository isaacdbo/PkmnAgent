name: Python CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.2 pytest==9.1.1

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: |
          if find . -path ./.git -prune -o \( -name 'test_*.py' -o -name '*_test.py' \) -print | grep -q .; then
            pytest
          else
            echo "No Python tests found; skipping pytest."
          fi
