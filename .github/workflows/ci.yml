name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only pytest: the suite covers the dependency-free reference bundle and the
      # build script, so CI needs neither torch nor the trained weights.
      - run: pip install pytest
      - run: pytest tests -q
